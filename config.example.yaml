# WAS Node Suite, the configuration schema.
#
# THIS IS THE TEMPLATE, NOT YOUR CONFIG FILE. Editing it changes nothing. Your own copy is
# written on first start at <ComfyUI user dir>/was-node-suite/config.yaml, and is brought up
# to date from this file on each release, keeping the values you have set.
#
# docs/CONFIG.md is the reference for every key below.

version: 16

logging:
  level: info            # debug | info | warning | error
  rich: true             # colourised output when rich is installed
  quotes: false          # accepted and has no effect

paths:
  # Write a Windows path with forward slashes or in single quotes, as 'D:/prompts'.
  wildcards: null        # directory of wildcard .txt files; null -> <user_dir>/was-node-suite/wildcards
  styles: null           # styles .json, or an A1111 styles .csv; null -> <user_dir>/was-node-suite/styles.json
  luts: null             # directory of .cube LUTs; null -> <user_dir>/was-node-suite/luts
  scratch: null          # folder frame batches too large for memory are kept in; null -> ComfyUI temp/
  allow_read: []         # extra readable directories, e.g. ["D:/datasets/prompts"]; Image Save also saves here
  allow_write: []        # extra writable directories, e.g. ["D:/renders"]

text:
  strip_comments: true   # reserved; comment handling does not read it. See docs/CONFIG.md

document:
  clean_html: true       # remove script, frame and event markup from emitted HTML

history:
  display_limit: 36      # how many recent entries the History nodes list

video:
  extra_codecs: {}       # extra muxer -> container pairs, e.g. {avc1: .mp4, h264: .mkv}

interface:
  preview_max_edge: 1024 # longest edge of a picture a node publishes to its own panel; 0 keeps full size

threejs:
  allow_scripts: false      # let a Three.js scene carry javascript this browser runs

viewer:
  install_extensions: false  # unpack .zip view extensions; what they need is named in the log
  allow_scripts: false       # let content in the Content Viewer run its own scripts and forms

llm:
  endpoints: {}          # extra servers for LLM Provider, by name, e.g.
                         # {lan-ollama: {url: "http://192.168.1.20:11434", api: ollama},
                         #  my-vllm: {url: "http://127.0.0.1:8000/v1", api: openai, key_env: VLLM_KEY}}
  mcp_servers: {}        # MCP servers for LLM MCP Tools, by name, e.g.
                         # {files: {command: npx, args: [-y, "@modelcontextprotocol/server-filesystem", "C:/notes"]},
                         #  tracker: {url: "https://mcp.example.com/mcp", bearer_env: TRACKER_TOKEN}}
  vector_stores: {}      # Qdrant, Chroma or Postgres servers for LLM Vector Store, by name, e.g.
                         # {team: {url: "https://qdrant.example.com:6333", api_key_env: QDRANT_API_KEY},
                         #  warehouse: {kind: postgres, url: "postgresql://comfy@db:5432/vectors", password_env: PG_PASSWORD}}

features:                # optional node groups
  extras:      true      # 27 nodes: LUTs, tiling, LoRA merging, sequence samplers, latent upscalers
  viewer:       true     #  2 nodes: Content Viewer and its canvas helper
  blip:         true     #  2 nodes: BLIP captioning and visual question answering
  clipseg:      true     #  3 nodes: CLIPSeg text-prompted masking
  sam:          true     #  4 nodes: Segment Anything masking
  midas:        true     #  2 nodes: MiDaS depth approximation and its model loader
  diffusers:    true     #  2 nodes: diffusers-format checkpoint loaders
  yunet:        true     #  2 nodes: YuNet face detection. Weights ship with the pack
  preprocessors: true    #  4 nodes: Power Preprocessor, HDR Reconstruct, Image Remove Background
                         #           and its model loader. Every answer runs in torch on weights
                         #           the pack publishes
  photoshop:   true      #  2 nodes: Layers Save and Layers Load, which write and read a
                         #           layered .psd and .tif. Both formats are laid out here,
                         #           so nothing is installed for them
  audio:       true      # editing, mixing, metering and effect nodes for AUDIO, on torch
                         #           and scipy, so nothing is installed for them
  threejs:     true      # 43 nodes: build a Three.js scene on the canvas and render it in
                         #           the browser. Three.js ships with the pack, and the browser
                         #           fetches it only when a scene runs
  document_export: false #  0 nodes: lets Save DOC write .docx, .odt and .pdf. The only group
                         #           whose packages ComfyUI does not already require, so it
                         #           starts off and nothing is installed for a fresh install
                         #           pip install -r requirements/document_export.txt
  network:     false     #  0 nodes: permits model downloads when a file is not already on disk, and web addresses in Three Texture URL
                         #           The (ComfyUI Native) node beside each loads either way
  pssr:        false     #  1 node:  PS-SR video super resolution. Needs a 22 GB checkout
                         #           placed by hand, and diffsynth; see docs/MODELS.md
  llm:         false     # language models, documents, indexes, retrieval, chat, memory and
                         #           agents, on llama-index. Hosted models also need network
                         #           pip install -r requirements/llm.txt
  vector_stores: false   #  0 nodes: lets LLM Vector Store keep indexes in Chroma, LanceDB, FAISS
                         #           and Postgres as well as Qdrant
                         #           pip install -r requirements/vector_stores.txt

                         # extras and viewer are the nodes of two other WAS packs. Set either
                         # to false to run the standalone pack instead.

legacy:                  # nodes another node does better
  loaders:     true      # 5 nodes:  loaders that also answer the file name as a string
  switches:    true      # 11 nodes: one typed switch per socket type
  text_type:   true      # 2 nodes:  passthroughs between text sockets, which are all STRING
  core_dupes:  true      # 3 nodes:  superseded one-for-one by a core ComfyUI node
  sampling:    true      # 1 node:   KSampler (Seed Socket)
  cache:       false     # 2 nodes:  Cache Node, Load Cache
  debug:       false     # 2 nodes:  Export API, Samples Passthrough
  dupes:       false     # 1 node:   CLIPSeg Tiled Masking
  superseded:  false     # 1 node:   MiDaS Mask Image

nodes:                   # per-node overrides; these beat both blocks above
  enable: []             # e.g. ["KSampler (WAS)", "Cache Node"]
  disable: []            # e.g. ["Download Image"]
                         # Names are node ids
